<data name="m" lambda="zeiterfassung.month" with="month={{ state.month }}, by={{ state.by }}" when="{{ state.view == 'month' }}"/>
<on event="time-changed" action="reload"/>
<split width=288 side=left gap=6 sticky=true>
<col gap=3>
  <report-tabs/>
  {{#if data.m}}
  <row gap=2 align=center wrap=true>
    <button action="state" state="month" value="{{ data.m.prev }}" label="←" tip="Previous month" variant=plain size=md/>
    <col width=176 align=center><heading level=2>{{ data.m.label }}</heading><text tone=muted>{{ data.m.weeksText }}</text></col>
    <button action="state" state="month" value="{{ data.m.next }}" label="→" tip="Next month" variant=plain size=md/>
    {{#if not data.m.isCurrent}}<button action="state" state="month" value="{{ data.m.current }}" label="This month" variant=plain/>{{/if}}
  </row>
  <row gap=2 align=end wrap=true>
    <col width=170><input stack=true bind="month" type=month label="Jump to month" value="{{ data.m.key }}"/></col>
    <col width=144><select stack=true bind="by" options="{{ data.m.reporterOptions | tojson }}" label="Reported by"/></col>
    <button action="url" href="{{ data.m.csv }}" label="CSV" variant=plain size=md/>
  </row>
  {{/if}}
</col>
{{#if data.m}}
<col gap=6>
  {{#if data.m.unreadable}}<callout tone=bad>{{ data.m.unreadable }}</callout>{{/if}}
  <grid cols=3 gap=3 min=200 keep=true>
    <tile tint=true label="{{ data.m.booked.label }}" value="{{ data.m.booked.num }}" suffix="{{ data.m.booked.of }}" sub="{{ data.m.booked.sub }}" tone="{{ data.m.booked.tone }}" mark="{{ data.m.booked.mark }}"/>
    <tile tint=true label="{{ data.m.past.label }}" value="{{ data.m.past.value }}" sub="{{ data.m.past.sub }}" tone="{{ data.m.past.tone }}" mark="{{ data.m.past.mark }}">
      {{#if data.m.past.weeks}}<row gap=1 wrap=true>{{#each data.m.past.weeks}}<button action="state" state="week" value="{{ key }}" emit="openweek" label="{{ label }}" tip="{{ title }}" variant=chip tone="{{ missing ? 'bad' : 'good' }}"/>{{/each}}</row>{{/if}}
    </tile>
    <tile tint=true label="{{ data.m.entries.label }}" value="{{ data.m.entries.value }}" sub="{{ data.m.entries.sub }}" tone="{{ data.m.entries.tone }}" mark="{{ data.m.entries.mark }}"/>
  </grid>

  <section card=true title="Days" sub="{{ data.m.calendarHint }}">
    {{#if data.m.slotActions}}<row gap=2 wrap=true justify=end align=center>{{#if data.m.oldestPull}}<small><muted>{{ data.m.oldestPull }}</muted></small>{{/if}}{{#each data.m.slotActions}}<button run="{{ flow }}" with="{{ with }}" emit="time-changed" confirm="{{ confirm }}" label="{{ label }}" tip="{{ tip }}" variant=plain/>{{/each}}</row>{{/if}}
    <grid tracks="3rem repeat(7,minmax(0,1fr)) 4.5rem" gap=1 minw=576>
      <text></text>
      {{#each data.m.weekdays}}<col><small tone=muted><b>{{ this | upper }}</b></small></col>{{/each}}
      <col align=end><small tone=muted><b>WEEK</b></small></col>
      {{#each data.m.calendar}}
      <col align=center><button action="state" state="week" value="{{ key }}" emit="openweek" label="{{ label }}" tip="{{ title }}" variant=quiet/></col>
      {{#each cells}}
      {{#if in}}
      <box dense=true tone="{{ tone }}" ring="{{ today ? 'true' : 'false' }}" action="state" state="week" value="{{ week }}" emit="openweek" tip="{{ title }}">
        <row justify=between><small>{{#if today}}<b>{{ day }}</b>{{#else}}{{ day }}{{/if}}</small><small>{{ note }}</small></row>
        <col align=end><text><b>{{ main }}</b>{{#if gap}} <small>{{ gap }}</small>{{/if}}</text></col>
      </box>
      {{#else}}<text></text>{{/if}}
      {{/each}}
      <col align=end gap=0><text><b>{{ booked }}</b></text><small tone=muted>{{ of }}</small></col>
      {{/each}}
    </grid>
    <small><muted>red: hours missing · amber: due today · grey: off / absent</muted></small>
    {{#if data.m.approvals}}<row gap=3 wrap=true><small><muted>green: {{ data.m.approvals.legendAll }}</muted></small><small><muted>8 / 12 {{ data.m.approvals.legendPartly }}</muted></small><small><muted>{{ data.m.approvals.legendNone }}</muted></small>{{#if data.m.approvals.unpulled}}<small><muted>{{ data.m.approvals.unpulled }}</muted></small>{{/if}}</row>{{/if}}
  </section>

  <section card=true title="Hours per job and week">
    {{#if data.m.jobRows}}
    <sheet compact=true caption="Hours per job and week">
      <shead><srow>
        <scell head=true>Job</scell>
        {{#each data.m.weekHeads}}<scell head=true num=true><col align=end><button action="state" state="week" value="{{ key }}" emit="openweek" label="{{ label }}" variant=link/><small>{{ range }}</small></col></scell>{{/each}}
        <scell head=true num=true>Total</scell>
        <scell head=true num=true>Share</scell>
      </srow></shead>
      <sbody>
        {{#each data.m.jobRows}}
        <srow hover=true>
          <scell row=true>{{#if project}}<text><b>{{ project }}</b></text><small tone=muted><mono>{{ number }}</mono></small>{{#else}}<text><b>{{ number }} {{ name }}</b></text>{{#if customer}}<small tone=muted>{{ customer }}</small>{{/if}}{{/if}}</scell>
          {{#each weeks}}<scell num=true>{{ this }}</scell>{{/each}}
          <scell num=true bold=true>{{ total }}</scell>
          <scell num=true tone=muted>{{ share }}</scell>
        </srow>
        {{/each}}
      </sbody>
      <sfoot>
        <srow bold=true><scell row=true>Booked</scell>{{#each data.m.foot.booked}}<scell num=true>{{ this }}</scell>{{/each}}<scell num=true>{{ data.m.foot.bookedTotal }}</scell><scell num=true></scell></srow>
        {{#if data.m.foot.missing}}<srow bold=true tone=bad><scell row=true>Missing</scell>{{#each data.m.foot.missing}}<scell num=true>{{ this }}</scell>{{/each}}<scell num=true>{{ data.m.foot.missingTotal }}</scell><scell num=true></scell></srow>{{/if}}
        <srow tone=muted><scell row=true>Target</scell>{{#each data.m.foot.target}}<scell num=true>{{ this }}</scell>{{/each}}<scell num=true>{{ data.m.foot.targetTotal }}</scell><scell num=true></scell></srow>
      </sfoot>
    </sheet>
    {{#else}}<text tone=muted>{{ data.m.emptyJobs }}</text>{{/if}}
  </section>

  <grid cols=2 gap=4 min=300>
    <section card=true title="Hours by type">
      <chart kind=bar look=track source="data.m.typeItems" group="label" value="value" text="valueLabel" empty="No entries."/>
    </section>
    <section card=true title="Hours by tag">
      <chart kind=bar look=track source="data.m.tagItems" group="label" value="value" text="valueLabel" empty="No entries."/>
    </section>
  </grid>

  <section card=true title="{{ data.m.reportHead }}" sub="{{ data.m.reportMeta }}">
    {{#if data.m.summaries}}
    <row justify=end><copy text="{{ data.m.summaryText }}" label="Copy report"/></row>
    <col gap=3>
    {{#each data.m.summaries}}
    <section framed=true collapsible=true open=true title="{{ number }} {{ name }}" aside="{{ share }} · {{ hours }}">
      {{#each lines}}
      <row justify=between gap=3 wrap=false align=start><text>{{ label }} {{#if count}}<small tone=muted>{{ count }}</small>{{/if}}</text><row gap=2 wrap=false><small tone=muted tip="{{ title }}">{{ days }}</small><badge tint="{{ color }}">{{ type }}</badge><b>{{ hours }}</b></row></row>
      {{/each}}
    </section>
    {{/each}}
    </col>
    {{#else}}<text tone=muted>No time booked in this month.</text>{{/if}}
  </section>

  <section card=true title="{{ data.m.entriesHead }}" aside="{{ data.m.entryList | count }}" collapsible=true open=false>
    {{#if data.m.entryList}}
    <sheet compact=true caption="Entries of the month">
      <shead><srow><scell head=true>Date</scell><scell head=true>Job</scell><scell head=true num=true>Hours</scell><scell head=true>Report</scell><scell head=true>Ticket</scell><scell head=true>Type · tags</scell><scell head=true></scell></srow></shead>
      <sbody>
        {{#each data.m.entryList}}
        <srow hover=true>
          <scell><col gap=0><mono size=sm><edit type=date value="{{ date }}" label="Date" tip="Click to change the day" run="zeiterfassung.entry-op" with="op=date, id={{ id }}, date=$value" emit="time-changed" done="Saved."/></mono>{{#if start}}<small tone=muted><mono>{{ start }}</mono></small>{{/if}}</col></scell>
          <scell><col width=150><truncate tip="{{ job }}">{{ jobName }}</truncate></col></scell>
          <scell num=true bold=true><edit type=number value="{{ hoursValue }}" text="{{ hours }}" min=0.25 max=24 step=0.25 label="Hours" tip="Click to change the hours" run="zeiterfassung.entry-hours" with="id={{ id }}, hours=$value" emit="time-changed" done="Saved."/></scell>
          <scell>{{#if mark}}<small tip="{{ markTitle }}">{{ mark }}</small> {{/if}}{{ description }}</scell>
          <scell>{{#if ticket}}{{#if ticketUrl}}<button action="url" href="{{ ticketUrl }}" label="{{ ticket }}" tip="{{ ticketTip }}" variant=link/>{{#else}}<mono size=sm>{{ ticket }}</mono>{{/if}}{{/if}}</scell>
          <scell><col gap=1 align=start><badge tint="{{ color }}">{{ type }}</badge>{{#each tagNames}}<badge color=teal>{{ this }}</badge>{{/each}}</col></scell>
          <scell><button action="state" state="week" value="{{ date }}" emit="openweek" label="→" tip="Open its week to edit it" variant=quiet/></scell>
        </srow>
        {{/each}}
      </sbody>
    </sheet>
    {{#else}}<empty text="No entries."/>{{/if}}
  </section>
</col>
{{#else}}<text tone=muted>…</text>{{/if}}
</split>
