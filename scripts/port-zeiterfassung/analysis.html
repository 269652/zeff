<data name="a" lambda="zeiterfassung.analysis" with="weeks={{ state.aweeks }}, tickets={{ state.atickets }}, split={{ state.asplit }}" when="{{ state.view == 'analysis' }}"/>
<split width=288 side=left gap=6 sticky=true>
<col gap=3>
  <report-tabs/>
  <col gap=1><heading level=2>Analysis</heading>{{#if data.a}}<text tone=muted>{{ data.a.intro }}</text>{{/if}}</col>
  {{#if data.a}}
  <row gap=1>
    <button action="state" state="atickets" value="" label="Everyone" variant="{{ data.a.mine ? 'plain' : 'primary' }}" tip="Jira metrics for everyone's tickets, or only the tickets you booked time on in this range"/>
    <button action="state" state="atickets" value="mine" label="Mine" variant="{{ data.a.mine ? 'primary' : 'plain' }}"/>
  </row>
  <row gap=1 wrap=true>
    {{#each data.a.ranges}}<button action="state" state="aweeks" value="{{ weeks }}" label="{{ label }}" variant="{{ weeks == data.a.weeks ? 'primary' : 'plain' }}"/>{{/each}}
  </row>
  {{/if}}
</col>
{{#if data.a}}
<col gap=6>
  {{#if data.a.hasData}}
  <col gap=3>
  <grid cols=5 gap=3 min=150>
    {{#each data.a.cards}}<tile label="{{ label }}" value="{{ value }}" tip="{{ hint }}" tint=true/>{{/each}}
  </grid>
  {{#if data.a.jiraCards}}<grid cols=4 gap=3 min=150>{{#each data.a.jiraCards}}<tile tint=true label="{{ label }}" value="{{ value }}" tone="{{ tone }}" tip="{{ hint }}"/>{{/each}}</grid>{{/if}}
  {{#if data.a.ticketCards}}<grid cols=4 gap=3 min=150>{{#each data.a.ticketCards}}<tile tint=true label="{{ label }}" value="{{ value }}" tone="{{ tone }}" tip="{{ hint }}"/>{{/each}}</grid>{{/if}}
  </col>

  <grid cols=2 gap=4 min=320>
    <section card=true title="Time split by type">
      <row gap=6 align=center wrap=false>
        <chart kind=pie source="data.a.typeSplit" group="label" value="hours" center="{{ data.a.meetingPercent }}" centersub="Meetings" legend=false/>
        <col gap=2>
          {{#each data.a.typeSplit}}<row gap=2 align=center wrap=false><dot color="{{ color }}"/><col width=80><truncate tip="{{ label }}">{{ label }}</truncate></col><b>{{ hoursText }}</b><small tone=muted>{{ pct }}</small></row>{{/each}}
        </col>
      </row>
    </section>
    <section card=true title="Hours by job">
      <chart kind=bar look=track source="data.a.jobItems" group="label" value="value" text="valueLabel" empty="No entries."/>
    </section>
  </grid>

  <section card=true title="Weekly hours & tickets" aside="{{ data.a.weekLegend }}">
    <chart kind=column look=track source="data.a.weekRows" group="week" value="hours" series="type" text="badge"/>
  </section>

  {{#if data.a.ticketCards}}
  <grid cols=2 gap=4 min=320>
    <section card=true title="Performance" aside="resolution time · lower is better">
      <chart kind=line source="data.a.performance" group="week" value="days"/>
      <small><muted>Avg days from a ticket opening to its resolution, by the week it was resolved.</muted></small>
    </section>
    <section card=true title="Parallelism" aside="tickets open at once">
      <chart kind=line source="data.a.parallel" group="week" value="tickets"/>
      <small><muted>Number of tickets in flight (opened but not yet resolved) during each week.</muted></small>
    </section>
  </grid>
  {{/if}}
  {{#if data.a.datesHint}}<callout tone=info>Reaction time and parallelism need ticket opened dates. Re-sync on the Jira tab to backfill them.</callout>{{/if}}

  <grid cols=2 gap=4 min=320>
    <section card=true>
      <row gap=2 align=center><text tone=muted><b>HOURS BY</b></text><select bind="asplit" options='[["","Tag"],["type","Type"]]' value="{{ data.a.split == 'type' ? 'type' : '' }}"/></row>
      <chart kind=bar look=track source="data.a.splitItems" group="label" value="value" text="valueLabel" empty="{{ data.a.splitEmpty }}"/>
    </section>
    <section card=true title="Top tickets by hours">
      <chart kind=bar look=track source="data.a.ticketItems" group="label" value="value" text="valueLabel" link="url" empty="No tickets."/>
    </section>
  </grid>
  <small tone=muted>{{ data.a.foot }}</small>
  {{#else}}<box><text tone=muted>{{ data.a.empty }}</text></box>{{/if}}
</col>
{{#else}}<text tone=muted>…</text>{{/if}}
</split>
