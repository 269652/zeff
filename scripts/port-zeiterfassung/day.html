<data name="f" lambda="zeiterfassung.day" with="date={{ state.fdate }}, week={{ state.fweek }}, state={{ state | tojson }}" when="{{ state.view == 'day' }}" debounce=600/>
<on event="day-changed" action="reload"/>
<split width=288 side=left gap=6 sticky=true>
<col gap=3>
  <report-tabs/>
  {{#if data.f}}
  <col gap=3>
    <heading level=2>{{ data.f.title }}</heading>
    <text tone=muted>{{ data.f.intro }}</text>
    <text>{{#if data.f.mode == 'week'}}<button action="state" state="fweek" value="" label="← End of day" variant=link/>{{#else}}<button action="state" state="fweek" value="current" label="The whole week →" variant=link/>{{/if}}</text>
    <small tone=muted>It's booked just like by hand; then everything is in the weekly report (and goes from there to Chrono/Punch when you export).</small>
  </col>
  {{/if}}
</col>
{{#if data.f}}
<col gap=6>
  {{#if data.fbooked.fbooked.message}}
  <callout tone=good>
    <row gap=2 align=center justify=between wrap=true>
      <text>{{ data.fbooked.fbooked.message }}</text>
      {{#if data.fbooked.fbooked.created}}<button run="zeiterfassung.day-undo" with="created={{ data.fbooked.fbooked.created }}" into="fundone" emit="day-changed" done="Taken back." label="Undo" variant=plain/>{{/if}}
    </row>
  </callout>
  {{/if}}
  {{#each data.f.days}}
  {{#if data.f.mode == 'week'}}<heading level=3>{{ head }} <small tone=muted>{{ sub }}</small></heading>{{/if}}
  <section card=true>
    <row gap=4 wrap=true align=start justify=between>
      <row gap=6 wrap=true align=center>
        <text>{{ sums.booked }}</text><text>{{ sums.selected }}</text>
        {{#if sums.itemized}}<text tone=muted>{{ sums.itemized }}</text>{{/if}}
        <text tone="{{ sums.tone }}">{{ sums.result }}</text>
      </row>
      <col gap=1 align=end>
        <row gap=2 align=center>
          <button action="state" state="{{ spreadKey }}" value="{{ spreadOn ? '' : '1' }}" label="Spread the rest" tip="Spread the missing hours over the ticked ticket lines" variant="{{ spreadOn ? 'primary' : 'plain' }}" disabled="{{ canSpread ? 'false' : 'true' }}"/>
          <button run="zeiterfassung.day-book" with="date={{ date }}, state={{ state | tojson }}" into="fbooked" emit="day-changed" label="{{ bookLabel }}" disabled="{{ whyNot ? 'true' : 'false' }}" variant=primary/>
        </row>
        {{#if whyNot}}<small tone=warn>{{ whyNot }}</small>{{/if}}
      </col>
    </row>
  </section>
    {{#if lines}}
    <col gap=2>
      {{#each lines}}
      <let name="inc" value="state | get(ki) | default(include)"/>
      <box tone="{{ inc == '1' ? 'plain' : 'muted' }}">
        <row gap=2 align=center wrap=true>
          <button action="state" state="{{ ki }}" value="{{ inc == '1' ? '0' : '1' }}" label="{{ inc == '1' ? '☑' : '☐' }}" tip="Book {{ description }}" variant=quiet/>
          <small><muted>{{ kindLabel }}</muted></small>
          <input bind="{{ kh }}" type=number label="Hours" value="{{ hours }}" placeholder="h"/>
          {{#if kind == 'suggestion'}}<small><muted>{{ jobText }}</muted></small>{{#else}}<select bind="{{ kj }}" options="{{ jobOptions | tojson }}" label="Job"/>{{/if}}
          <input bind="{{ kd }}" label="Description" value="{{ description }}"/>
        </row>
        <row gap=3 wrap=true align=center>
          <small><muted>{{#if ticket}}{{ ticket }} · {{/if}}{{ from }}</muted></small>
          {{#if isGroup}}<small>Group: the day's work goes under it</small>{{/if}}
          {{#if itemize}}<let name="sep" value="state | get(ks) | default(standalone)"/><button action="state" state="{{ ks }}" value="{{ sep == '1' ? '0' : '1' }}" label="{{ sep == '1' ? '☐' : '☑' }} {{ itemize }}" variant=quiet/>{{/if}}
        </row>
      </box>
      {{/each}}
    </col>
    {{#else}}<col align=center><text tone=muted>{{ empty }}</text></col>{{/if}}
  {{/each}}
</col>
{{#else}}<text tone=muted>…</text>{{/if}}
</split>
