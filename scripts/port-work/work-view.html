<pane flush=true>

<input bind="cbranch" placeholder="{{ data.x.composer.labels.branch }}"/><row gap=1 wrap=true align=center><small><muted>{{ data.x.composer.labels.folder }}</muted></small><text>{{ data.x.composer.repoNow }}</text><button action="state" state="cbrowse" value="{{ state.cbrowse == '1' ? '0' : '1' }}" label="{{ data.x.composer.labels.browse }}" variant=quiet/></row>

<col gap=1>

<row gap=1 wrap=true align=center><input bind="cdirtype" placeholder="{{ data.x.composer.folders.path }}"/><button action="state" state="cdir" value="{{ state.cdirtype }}" label="{{ data.x.composer.labels.go }}"/>{{#if data.x.composer.folders.parent}}<button action="state" state="cdir" value="{{ data.x.composer.folders.parent }}" label="↑ {{ data.x.composer.labels.up }}" variant=quiet/>{{/if}}<button action="state" state="cuse" value="{{ data.x.composer.folders.path }}" label="{{ data.x.composer.labels.use }}" variant=primary/></row>

{{#if always}}<button run="work.live" with="run={{ data.x.session.runId }}, do=answer, requestId={{ requestId }}, behavior=allow, always=true" emit="work-changed" label="{{ alwaysLabel }}" tip="{{ alwaysTip }}"/>{{/if}}
<button run="work.live" with="run={{ data.x.session.runId }}, do=answer, requestId={{ requestId }}, behavior=deny, message={{ state.note }}" then="note=" emit="work-changed" label="Deny"/>
<button run="work.live" with="run={{ data.x.session.runId }}, do=answer, requestId={{ requestId }}, behavior=deny, interrupt=true, message={{ state.note }}" then="note=" emit="work-changed" label="Deny & stop" tip="Deny and stop its turn"/>
</row>
{{/if}}
{{#if more}}<small><muted>{{ more }}</muted></small>{{/if}}
</box>
{{/if}}
{{/each}}
{{#if data.x.session.lostLive}}
<box tone=warn title="No live connection to this session">
<small><muted>It is marked as running, but this Zeff isn't connected to its worker — it was started by another Zeff window or before a restart, so its questions and permissions can't be shown here. Stop it and start it again.</muted></small>
<row gap=2><button run="work.stop" with="run={{ data.x.session.runId }}" emit="work-changed" label="⏹ Stop it" variant=danger/></row>
</box>
{{/if}}
{{#if data.x.session.permission}}
<box tone=warn title="Copilot wants to: {{ data.x.session.permission.title }}">
{{#if data.x.session.permission.detail}}<text pre=true>{{ data.x.session.permission.detail }}</text>{{/if}}
<row gap=2 wrap=true>{{#each data.x.session.permission.options}}<button run="work.live" with="run={{ data.x.session.runId }}, do=answer-option, option={{ id }}" emit="work-changed" label="{{ name }}" variant="{{ kind == 'allow_once' ? 'primary' : 'plain' }}"/>{{/each}}</row>
</box>
{{/if}}
{{#if data.x.session.copilot}}
<row gap=2 wrap=true align=center>
<small><muted>Mode</muted></small>
{{#each data.x.session.copilot.modes}}<button run="work.live" with="run={{ data.x.session.runId }}, do=mode, mode={{ id }}" emit="work-changed" label="{{ name }}" tip="{{ hint }}" variant="{{ sel ? 'primary' : 'plain' }}" disabled="{{ sel }}"/>{{/each}}
<small><muted>{{ data.x.session.copilot.status }}</muted></small>
</row>
{{#if data.x.session.copilot.idle}}{{#if data.x.session.copilot.waiting}}<markdown value="{{ data.x.session.copilot.waiting }}"/>{{/if}}{{/if}}
{{/if}}
{{#if data.x.session.queuedLabel}}<small><muted>{{ data.x.session.queuedLabel }}</muted></small>{{/if}}
{{#if data.shellout.out}}<text pre=true tone="{{ data.shellout.code == '0' ? 'muted' : 'bad' }}">{{ data.shellout.out }}</text>{{/if}}
<col gap=1>
{{#if data.x.session.menu}}
<box>
<row gap=1 wrap=true>{{#each data.x.session.menu}}<button action="state" state="msg" value="{{ next }}" label="{{ label }}" tip="{{ hint }}" variant=quiet/>{{/each}}</row>
</box>
{{/if}}
{{#each data.x.session.files}}<row gap=2 align=center><small>📎 {{ name }} · {{ size }}</small><button run="work.attach-remove" with="scope={{ data.x.session.attachScope }}, ref={{ ref }}" emit="work-changed" label="✕" variant=quiet/></row>{{/each}}
<box field=true>
<input bind="msg" bare=true grow=true rows=2 placeholder="{{ data.x.session.placeholder }}" enter="{{ data.x.session.isShell ? 'send-shell' : (data.x.session.canReplyLive ? 'send-live' : 'send-msg') }}"/>
<row gap=1 wrap=true align=center>
<upload bind="busyup" run="work.attach" with="scope={{ data.x.session.attachScope }}" multiple=true zone=view label="📎" accept="{{ data.x.session.kind == 'session' ? 'image/png,image/jpeg,image/gif,image/webp' : '' }}" emit="work-changed"/>
{{#if data.x.session.busy}}<button run="work.live" with="run={{ data.x.session.runId }}, do=interrupt" emit="work-changed" label="Interrupt"/>{{/if}}
{{#each data.x.session.modes}}<button run="work.live" with="run={{ data.x.session.runId }}, do=mode, mode={{ id }}" emit="work-changed" label="{{ label }}" tip="{{ hint }}" variant="{{ sel ? 'primary' : 'quiet' }}"/>{{/each}}
{{#each data.x.session.models}}<button run="work.live" with="run={{ data.x.session.runId }}, do=model, model={{ value }}" emit="work-changed" label="{{ label }}" variant="{{ sel ? 'primary' : 'quiet' }}"/>{{/each}}
{{#each data.x.session.efforts}}<button run="work.live" with="run={{ data.x.session.runId }}, do=effort, effort={{ value }}" emit="work-changed" label="{{ label }}" variant="{{ sel ? 'primary' : 'quiet' }}" disabled="{{ data.x.session.busy }}"/>{{/each}}
<grow/>
{{#if data.x.session.hostText}}<small><muted>{{ data.x.session.hostText }}</muted></small>{{/if}}
{{#if data.x.session.shellPendingLabel}}<small><muted>{{ data.x.session.shellPendingLabel }}</muted></small>{{/if}}
{{#if data.x.session.kind}}
<button run="work.live" with="run={{ data.x.session.runId }}, do=wrap-up" emit="work-changed" label="Finish" tip="It sums up and gives its result — that ends the session: its todo ticked off, its time booked" disabled="{{ data.x.session.busy }}"/>
<button run="work.live" with="run={{ data.x.session.runId }}, do=close" confirm="Close the session without a result? (Nothing is ticked off or booked.)" emit="work-changed" label="Close" tip="End it without a result" variant=quiet/>
{{/if}}
{{#if data.x.session.isShell}}
<button run="work.live" with="run={{ data.x.session.runId }}, do=shell, cmd={{ data.x.session.shellCmd }}" into="shellout" then="msg=" emit="work-changed" label="↵" tip="Run in its folder" variant=send disabled="{{ not data.x.session.shellCmd }}"/>
{{#else}}
{{#if data.x.session.canReplyLive}}
<button run="work.live" with="run={{ data.x.session.runId }}, do=send, text={{ state.msg }}, attach={{ data.x.session.attachScope }}" then="msg=" emit="work-changed" label="↑" tip="Send" variant=send disabled="{{ not state.msg }}"/>
{{#else}}
<button run="work.send" with="run={{ data.x.session.runId }}, text={{ state.msg }}, attach={{ data.x.session.attachScope }}" then="msg=" emit="work-changed" label="↑" tip="Send" variant=send disabled="{{ not state.msg }}"/>
{{/if}}
{{/if}}
</row>
</box>
</col>
</dock>
{{/if}}
{{/if}}
{{/if}}
</pane>
</panes>
{{/if}}
