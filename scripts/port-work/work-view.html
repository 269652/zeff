<small><muted>Mode</muted></small>
{{#each data.x.session.copilot.modes}}<button run="work.live" with="run={{ data.x.session.runId }}, do=mode, mode={{ id }}" emit="work-changed" label="{{ name }}" tip="{{ hint }}" variant="{{ sel ? 'primary' : 'plain' }}" disabled="{{ sel }}"/>{{/each}}
<small><muted>{{ data.x.session.copilot.status }}</muted></small>
</row>
{{#if data.x.session.copilot.idle}}{{#if data.x.session.copilot.waiting}}<markdown value="{{ data.x.session.copilot.waiting }}"/>{{/if}}{{/if}}
{{/if}}
{{#if data.x.session.queuedLabel}}<small><muted>{{ data.x.session.queuedLabel }}</muted></small>{{/if}}
{{#if data.shellout.out}}<text pre=true tone="{{ data.shellout.code == '0' ? 'muted' : 'bad' }}">{{ data.shellout.out }}</text>{{/if}}
<col dock=bottom gap=1>
{{#if data.x.session.menu}}
<box>
<row gap=1 wrap=true>{{#each data.x.session.menu}}<button action="state" state="msg" value="{{ next }}" label="{{ label }}" tip="{{ hint }}" variant=quiet/>{{/each}}</row>
</box>
{{/if}}
{{#each data.x.session.files}}<row gap=2 align=center><small>📎 {{ name }} · {{ size }}</small><button run="work.attach-remove" with="scope={{ data.x.session.attachScope }}, ref={{ ref }}" emit="work-changed" label="✕" variant=quiet/></row>{{/each}}
<input bind="msg" rows=3 placeholder="{{ data.x.session.placeholder }}" enter="{{ data.x.session.isShell ? 'send-shell' : (data.x.session.canReplyLive ? 'send-live' : 'send-msg') }}"/>
<row gap=2 wrap=true align=center>
{{#if data.x.session.isShell}}
<button run="work.live" with="run={{ data.x.session.runId }}, do=shell, cmd={{ data.x.session.shellCmd }}" into="shellout" then="msg=" emit="work-changed" label="Run in its folder" variant=primary disabled="{{ not data.x.session.shellCmd }}"/>
{{#else}}
{{#if data.x.session.canReplyLive}}
<button run="work.live" with="run={{ data.x.session.runId }}, do=send, text={{ state.msg }}, attach={{ data.x.session.attachScope }}" then="msg=" emit="work-changed" label="Send" variant=primary disabled="{{ not state.msg }}"/>
{{#else}}
<button run="work.send" with="run={{ data.x.session.runId }}, text={{ state.msg }}, attach={{ data.x.session.attachScope }}" then="msg=" emit="work-changed" label="Send" variant=primary disabled="{{ not state.msg }}"/>
{{/if}}
{{/if}}
<upload bind="busyup" run="work.attach" with="scope={{ data.x.session.attachScope }}" multiple=true zone=view label="📎" accept="{{ data.x.session.kind == 'session' ? 'image/png,image/jpeg,image/gif,image/webp' : '' }}" emit="work-changed"/>
{{#if data.x.session.busy}}<button run="work.live" with="run={{ data.x.session.runId }}, do=interrupt" emit="work-changed" label="Interrupt"/>{{/if}}
{{#each data.x.session.modes}}<button run="work.live" with="run={{ data.x.session.runId }}, do=mode, mode={{ id }}" emit="work-changed" label="{{ label }}" tip="{{ hint }}" variant="{{ sel ? 'primary' : 'quiet' }}"/>{{/each}}
{{#each data.x.session.models}}<button run="work.live" with="run={{ data.x.session.runId }}, do=model, model={{ value }}" emit="work-changed" label="{{ label }}" variant="{{ sel ? 'primary' : 'quiet' }}"/>{{/each}}
{{#each data.x.session.efforts}}<button run="work.live" with="run={{ data.x.session.runId }}, do=effort, effort={{ value }}" emit="work-changed" label="{{ label }}" variant="{{ sel ? 'primary' : 'quiet' }}" disabled="{{ data.x.session.busy }}"/>{{/each}}
<grow/>
{{#if data.x.session.hostText}}<small><muted>{{ data.x.session.hostText }}</muted></small>{{/if}}
{{#if data.x.session.shellPendingLabel}}<small><muted>{{ data.x.session.shellPendingLabel }}</muted></small>{{/if}}
{{#if data.x.session.kind}}
<button run="work.live" with="run={{ data.x.session.runId }}, do=wrap-up" emit="work-changed" label="Finish" tip="It sums up and gives its result — that ends the session: its todo ticked off, its time booked" disabled="{{ data.x.session.busy }}"/>
<button run="work.live" with="run={{ data.x.session.runId }}, do=close" confirm="Close the session without a result? (Nothing is ticked off or booked.)" emit="work-changed" label="Close" tip="End it without a result" variant=quiet/>
{{/if}}
</row>
</col>
{{/if}}
</col>
{{/if}}
{{/if}}
</col>
</row>
{{/if}}
