<col gap=1>
<row gap=1 wrap=true align=center>
{{#each data.x.chips}}<button action="pick" state="chips" value="{{ pick }}" label="{{ title }} ×" variant=plain tip="Remove this filter"/>{{/each}}
<col fill=true><input bind="omniq" enter="omni-first" placeholder="Search todos, tickets, mails, comments, notes, people …"/><on event="omni-first" action="pick" state="chips" value="{{ data.hits.first }}"/></col>
{{#if state.filter}}<button action="state" state="filter" value="" label="Clear the filter" variant=link/>{{/if}}
{{#if data.x.chips}}<button action="state" state="chips" value="[]" label="Clear the filter" variant=link/>{{/if}}
</row>
{{#if state.omniq}}
<box>
<col gap=1>
{{#if data.hits.none}}<small><muted>{{ data.hits.none }}</muted></small>{{/if}}
{{#each data.hits.hits}}
{{#if first}}<small><b>{{ label }}</b></small>{{/if}}
<row gap=2 wrap=false align=baseline><button action="pick" state="chips" value="{{ pick }}" label="{{ icon }} {{ title }}" variant=quiet/><col fill=true>{{#if sub}}<small><muted>{{ sub }}</muted></small>{{/if}}</col><small><muted>{{ n }}</muted></small></row>
{{/each}}
</col>
</box>
{{/if}}
</col>
