<row gap=2 wrap=true align=center>
{{#if data.lage.running}}
<small><muted>● {{ data.lage.runningText }}</muted></small>
<button run="todos-ext.board-run" with="stop=true" into="ran" emit="todos-changed" label="Cancel"/>
{{#else}}
<button run="todos-ext.board-run" with="stop=false" into="ran" emit="todos-changed" label="Run now" variant=primary tip="Reads your tickets, syncs first and has the AI write the briefing"/>
{{/if}}
{{#if data.lage.asOf}}<small><muted>{{ data.lage.asOf }}</muted></small>{{/if}}
{{#each data.lage.facts}}<chip>{{ text }}</chip>{{/each}}
</row>
{{#if data.ran.message}}<small><text tone="{{ data.ran.ok ? 'good' : 'bad' }}">{{ data.ran.message }}</text></small>{{/if}}
{{#if data.lage.failed}}<callout tone=bad><text>{{ data.lage.failed }}</text></callout>{{/if}}
